[program:dockerd]
command=/usr/sbin/dockerd --host=tcp://127.0.0.1:2375 --host=unix:///var/run/docker.sock --storage-driver=vfs --iptables=false
directory=/app
user=root
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --port 6379
user=root
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:uvicorn]
command=uvicorn app.main:app --host 0.0.0.0 --port 7860
directory=/app/backend
user=root
priority=30
environment=PYTHONPATH="/app/backend",DOCKER_HOST="tcp://127.0.0.1:2375"
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0