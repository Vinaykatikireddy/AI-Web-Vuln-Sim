[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisord/supervisord.log
logfile_maxbytes=1MB
logfile_backups=1
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false

[program:uvicorn]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisord/uvicorn.log
stderr_logfile=/var/log/supervisord/uvicorn-error.log
environment=
    DATABASE_URL="%(ENV_DATABASE_URL)s",
    SECRET_KEY="%(ENV_SECRET_KEY)s"

[program:redis]
command=redis-server --port 6379
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisord/redis.log
stderr_logfile=/var/log/supervisord/redis-error.log

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock