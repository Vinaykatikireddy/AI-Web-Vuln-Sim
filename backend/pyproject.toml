[tool.poetry]
name = "attack-simulation-backend"
version = "0.1.0"
description = "Backend for AI-powered web application attack simulation platform"
authors = ["Vinay katikireddy vinaykatikireddy@hotmail.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.30.0"
sqlalchemy = "^2.0.24"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.0"
python-jose = "^3.3.0"
bcrypt = "^4.1.3"
pydantic-settings = "^2.2.1"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.27.0"
black = "^23.12.1"
flake8 = "^6.1.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"