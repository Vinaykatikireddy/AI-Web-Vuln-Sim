<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Shield Rim Gradient -->
    <linearGradient id="shieldStroke" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- AI Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer Interlocking Defense Shell -->
  <g fill="none" stroke="url(#shieldStroke)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Defensive Arc -->
    <path d="M 230 76 C 145 88 100 135 100 240 C 100 350 170 410 238 440" opacity="0.9" />
    
    <!-- Right Defensive Arc (with vulnerability breakpoint gap) -->
    <path d="M 282 76 C 367 88 412 135 412 240 C 412 278 400 315 378 350" opacity="0.9" />
    <path d="M 345 390 C 318 420 290 435 274 440" stroke="#f43f5e" />
  </g>

  <!-- Neural AI Lattice (Nodes & Pathways) -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <!-- Synaptic Connectors -->
    <line x1="256" y1="120" x2="256" y2="186" />
    <line x1="256" y1="186" x2="196" y2="236" />
    <line x1="256" y1="186" x2="316" y2="236" />
    <line x1="196" y1="236" x2="196" y2="306" />
    <line x1="316" y1="236" x2="316" y2="306" />
    <line x1="196" y1="306" x2="256" y2="356" />
    <line x1="316" y1="306" x2="256" y2="356" />
    <line x1="256" y1="356" x2="256" y2="400" />
    <line x1="196" y1="236" x2="148" y2="216" />
    <line x1="196" y1="306" x2="148" y2="326" />
    <line x1="316" y1="236" x2="364" y2="216" stroke="#f43f5e" />
    <line x1="316" y1="306" x2="364" y2="326" stroke="#f43f5e" />
  </g>

  <!-- Peripheral Neural Endpoints -->
  <g fill="#00f5ff">
    <circle cx="256" cy="120" r="5" />
    <circle cx="148" cy="216" r="4.5" />
    <circle cx="148" cy="326" r="4.5" />
    <circle cx="256" cy="400" r="5" />
  </g>

  <!-- Exploit / Vulnerability Trace Endpoints (Rose/Red) -->
  <g fill="#f43f5e" filter="url(#glow)">
    <circle cx="364" cy="216" r="5" />
    <circle cx="364" cy="326" r="5" />
  </g>

  <!-- Core Faceted Processing Unit (Isometric Diamond Prism) -->
  <g filter="url(#glow)">
    <!-- Top Apex Segment -->
    <polygon points="256,186 196,236 256,260 316,236" fill="#00f5ff" opacity="0.9" />
    <!-- Left Shielded Facet -->
    <polygon points="196,236 256,260 256,356 196,306" fill="#6366f1" opacity="0.75" />
    <!-- Right Vulnerable/Exploited Facet -->
    <polygon points="316,236 256,260 256,356 316,306" fill="url(#coreGrad)" opacity="0.95" />
  </g>

  <!-- Central Intelligence Pulse (Internal Kernel) -->
  <circle cx="256" cy="270" r="12" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="270" r="5" fill="#0e1726" />
</svg>
